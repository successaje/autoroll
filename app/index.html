<!doctype html>
<html lang="en" data-theme="light" data-theme-preference="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="description" content="Carry a BTC or ETH event-contract view across eligible DreamDEX windows on Somnia Shannon testnet." />
    <title>AutoRoll · Rolling Event-Contract Strategies</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <script>
      (() => {
        const p = localStorage.getItem("autoroll-theme") || "system";
        const dark = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themePreference = p;
        document.querySelector('meta[name="theme-color"]').content = dark ? "#101318" : "#f4f6f8";
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-label="Starting AutoRoll">
        <img src="/icon.png" alt="" />
        <strong>AutoRoll</strong>
        <span aria-hidden="true">↻</span>
      </div>
    </div>
    <style>
      .boot-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;background:#f4f6f8;color:#111820;font:700 20px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot-splash img{width:34px;height:34px}.boot-splash span{margin-left:5px;color:#146b68;animation:boot-roll 1.5s linear infinite}[data-theme="dark"] .boot-splash{background:#101318;color:#eff4f6}[data-theme="dark"] .boot-splash span{color:#62c5be}@keyframes boot-roll{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-splash span{animation:none}}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
